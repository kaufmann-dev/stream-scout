<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>StreamScout</title>
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <header>
      <div class="site">
        <h1>StreamScout</h1>
        <span id="site-host" class="site-host"></span>
      </div>
      <button id="deactivate" type="button" hidden>Deactivate</button>
    </header>

    <p id="unsupported" class="note" hidden>StreamScout only works on http and https pages.</p>

    <section id="inactive" class="inactive" hidden>
      <p class="note">StreamScout is not active on this site. Streams are only detected after activation.</p>
      <button id="activate" class="primary" type="button">Activate on this site</button>
    </section>

    <section id="active" hidden>
      <div class="toolbar">
        <label class="setting">
          ffmpeg for
          <select id="shell"></select>
        </label>
        <label class="setting" title="Send the page URL without query as -referer. Some servers require it.">
          <input id="referer" type="checkbox" />
          Referer
        </label>
        <button id="copy-all" type="button" disabled>Copy all links</button>
      </div>
      <p id="empty" class="note" hidden>No streams found. Start playback or reload the page.</p>
      <ul id="list"></ul>

      <section id="frames" class="frames" hidden>
        <h2>Embedded sites</h2>
        <p class="note">Players in iframes are only detected if their site is activated too.</p>
        <ul id="frame-list"></ul>
      </section>
    </section>

    <p id="toast" class="toast" role="status" aria-live="polite"></p>

    <template id="frame-template">
      <li class="frame">
        <span class="frame-host"></span>
        <button class="small" type="button"></button>
      </li>
    </template>

    <template id="item-template">
      <li class="item">
        <div class="meta">
          <span class="title"></span>
          <span class="host"></span>
          <span class="status"></span>
        </div>
        <div class="tools">
          <label class="filename">
            <span class="visually-hidden">File name</span>
            <input type="text" spellcheck="false" autocomplete="off" maxlength="80" />
            <span class="ext">.mp4</span>
          </label>
          <div class="actions">
            <button class="copy-link primary" type="button">Copy link</button>
            <button class="copy-command small" type="button">Copy ffmpeg command</button>
          </div>
        </div>
      </li>
    </template>
  </body>
</html>
